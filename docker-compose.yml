# Lokaal draaien of testen. Voor productie: zie k8s/.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commoncontrol
      POSTGRES_USER: commoncontrol
      POSTGRES_PASSWORD: ${DB_PASSWORD:?zet DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commoncontrol"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Zet ze in een .env-bestand naast dit bestand.
      SECRET_KEY: ${SECRET_KEY:?zet SECRET_KEY in .env}
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_HOST: db
      DB_NAME: commoncontrol
      DB_USER: commoncontrol
      DB_PASSWORD: ${DB_PASSWORD:?zet DB_PASSWORD in .env}
      # Lokaal draait het op http; anders weigert Django de cookies.
      COOKIE_SECURE: "false"
      ADMIN_GEBRUIKERSNAAM: ${ADMIN_GEBRUIKERSNAAM:-beheerder}
      ADMIN_WACHTWOORD: ${ADMIN_WACHTWOORD:?zet ADMIN_WACHTWOORD in .env}
    ports:
      - "8000:8000"

volumes:
  db-data:
