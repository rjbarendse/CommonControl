apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: commoncontrol-db-data
  namespace: commoncontrol
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
  # storageClassName: longhorn   # zet de klasse van je eigen cluster
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commoncontrol-db
  namespace: commoncontrol
spec:
  replicas: 1
  strategy:
    # Recreate: twee PostgreSQL-pods op hetzelfde volume gaat mis.
    type: Recreate
  selector:
    matchLabels: {app: commoncontrol-db}
  template:
    metadata:
      labels: {app: commoncontrol-db}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: commoncontrol
            - name: POSTGRES_USER
              value: commoncontrol
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: commoncontrol-secret, key: DB_PASSWORD}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports: [{containerPort: 5432}]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "commoncontrol"]}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: commoncontrol-db-data}
---
apiVersion: v1
kind: Service
metadata:
  name: commoncontrol-db
  namespace: commoncontrol
spec:
  selector: {app: commoncontrol-db}
  ports: [{port: 5432, targetPort: 5432}]
