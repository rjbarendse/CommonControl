# VOORBEELD — niet zo in git zetten met echte waarden.
#
# Maak hem liever met kubectl, dan staan de geheimen nergens in een bestand:
#
#   kubectl -n commoncontrol create secret generic commoncontrol-secret \
#     --from-literal=SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(64))')" \
#     --from-literal=DB_PASSWORD="$(python -c 'import secrets;print(secrets.token_urlsafe(24))')" \
#     --from-literal=ADMIN_GEBRUIKERSNAAM=beheerder \
#     --from-literal=ADMIN_WACHTWOORD='een-lang-eerste-wachtwoord'
#
# Let op: verander SECRET_KEY nooit zonder ENCRYPTION_KEY apart te hebben gezet.
# De opgeslagen API-secrets zijn er anders niet meer uit te lezen en moeten
# opnieuw ingevoerd worden.
apiVersion: v1
kind: Secret
metadata:
  name: commoncontrol-secret
  namespace: commoncontrol
type: Opaque
stringData:
  SECRET_KEY: vervang-dit-door-een-lange-willekeurige-waarde
  DB_PASSWORD: vervang-dit
  ADMIN_GEBRUIKERSNAAM: beheerder
  ADMIN_WACHTWOORD: eerste-wachtwoord-direct-wijzigen
